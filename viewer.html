<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Read daily and Sunday Doonesbury comic strips in chronological order.">
    <title>Reader — Doonesbury Archive</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles.css">
    <script type="module" src="assets/viewer.js"></script>
  </head>
  <body class="viewer-page">
    <header class="site-header site-header--reader">
      <a class="wordmark" href="index.html" aria-label="Doonesbury Archive home">
        <span class="wordmark__title">Doonesbury</span>
        <span class="wordmark__subtitle">The strip archive</span>
      </a>
      <a class="index-link" href="index.html"><span aria-hidden="true">⌑</span> All years</a>
    </header>

    <main class="viewer-main">
      <p class="loading-message" id="reader-loading">Opening the archive…</p>
      <p class="error-panel" id="page-error" role="alert" hidden></p>

      <article class="reader" id="reader" hidden>
        <p class="reader-notice" id="reader-notice" role="status" hidden></p>

        <header class="strip-header">
          <div>
            <span class="strip-type" id="strip-type"></span>
            <h1 id="strip-date"></h1>
          </div>
          <p class="reader-progress" id="reader-progress" aria-label="Position in archive"></p>
        </header>

        <p class="strip-description" id="strip-description" hidden></p>

        <figure class="strip-frame">
          <img id="strip-image" alt="" decoding="async">
        </figure>

        <nav class="reader-navigation" aria-label="Strip navigation">
          <button class="button button--navigation" id="previous-strip" type="button">
            <span aria-hidden="true">←</span>
            <span><small>Previous</small> Earlier strip</span>
          </button>
          <p>Use <kbd>←</kbd> <kbd>→</kbd> to move</p>
          <button class="button button--navigation button--next" id="next-strip" type="button">
            <span><small>Next</small> Later strip</span>
            <span aria-hidden="true">→</span>
          </button>
        </nav>
      </article>
    </main>
  </body>
</html>
